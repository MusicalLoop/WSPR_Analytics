{% extends "base.html" %}
{% block content %}
<h2>Configuration</h2>
<form method="post" id="configForm">
    <div class="mb-3">
        <label for="CallSign" class="form-label">Call Sign</label>
        <input type="text" class="form-control" id="CallSign" name="CallSign" maxlength="10" value="{{ config['CallSign'] }}">
    </div>
    <div class="mb-3">
        <label class="form-label d-block">Mode</label>
        <div class="btn-group" role="group" aria-label="Mode">
            <input type="radio" class="btn-check" name="Mode" id="modeTx" value="tx"
                   {% if config['Mode'] == 'tx' %}checked{% endif %}>
            <label class="btn btn-outline-primary" for="modeTx">TX &mdash; Transmit</label>

            <input type="radio" class="btn-check" name="Mode" id="modeRx" value="rx"
                   {% if config['Mode'] == 'rx' %}checked{% endif %}>
            <label class="btn btn-outline-primary" for="modeRx">RX &mdash; Receive</label>

            <input type="radio" class="btn-check" name="Mode" id="modeBoth" value="both" disabled
                   {% if config['Mode'] == 'both' %}checked{% endif %}>
            <label class="btn btn-outline-primary text-muted" for="modeBoth">Both</label>
        </div>
        <div class="form-text">TX: analyse your transmissions &middot; RX: analyse your received spots &middot; Both: coming soon</div>
    </div>
    <div class="row mb-1">
        <div class="col-md-6">
            <label for="TxLat" class="form-label">Latitude</label>
            <input type="number" class="form-control" id="TxLat" name="TxLat" step="0.001" min="-90" max="90" value="{{ config['TxLat'] }}">
        </div>
        <div class="col-md-6">
            <label for="TxLon" class="form-label">Longitude</label>
            <input type="number" class="form-control" id="TxLon" name="TxLon" step="0.001" min="-180" max="180" value="{{ config['TxLon'] }}">
        </div>
    </div>
    <div class="form-text mb-3">Your transmitter location in decimal degrees (e.g. 55.021, -1.542 for Newcastle)</div>
    <hr>
    <div class="mb-3">
        <label for="Period" class="form-label">Period</label>
        <select class="form-select" id="Period" name="Period">
        {% for p in periods %}
            <option value="{{ p }}" {% if config['Period'] == p %}selected{% endif %}>{{ p }}</option>
        {% endfor %}
        </select>
    </div>
    <hr>
    <div class="mb-3">
        <label for="TopStations" class="form-label">Top Stations</label>
        <input type="number" class="form-control" id="TopStations" name="TopStations" maxlength="4" min="0" max="9999" value="{{ config['TopStations'] }}">
        <label for="NumBins" class="form-label">Number of Analysis Bins (6-20)</label>
        <input type="number" class="form-control" id="NumBins" name="NumBins" maxlength="2" min="6" max="20" value="{{ config['NumBins'] }}">
    </div>
    <button type="submit" name="submit" value="1" id="submitBtn" class="btn btn-primary">Submit</button>
    <button type="submit" name="reset" value="1" class="btn btn-secondary">Reset</button>
</form>
<script>
document.getElementById('configForm').addEventListener('submit', function (e) {
    if (e.submitter && e.submitter.id === 'submitBtn') {
        var btn = e.submitter;
        setTimeout(function () {
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>Fetching data...';
        }, 0);
    }
});
</script>
{% endblock %}
